<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Finder</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      background: #f2f4f8;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 40px;
    }

    .container {
      background: #ffffff;
      width: 100%;
      max-width: 700px;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    form {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      padding: 10px 14px;
      border: none;
      border-radius: 6px;
      background: #4a90e2;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #357abd;
    }

    #results {
        display: flex;
        flex-wrap: wrap;
        gap: 20px; 
        margin-top: 20px;
    }

    .book {
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 10px;
        width: 180px;
        box-shadow: 2px 2px 8px rgba(0,0,0,0.1);
        display: flex;
        flex-direction: column;
        align-items: center;
        background-color: #f9f9f9;
        }

    .book img {
        max-width: 100%;
        height: auto;
        border-radius: 4px;
        margin-bottom: 10px;
    }

    .book h3 {
        font-size: 1rem;
        text-align: center;
        margin: 5px 0;
    }

    .book p {
        font-size: 0.85rem;
        color: #555;
        text-align: center;
        margin: 5px 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Book Finder</h1>

    <form id="bookForm">
      <input
        type="text"
        id="bookInput"
        name="book"
        placeholder="Enter book title or author"
        required
      />
      <button type="submit">Search</button>
    </form>

    <div id="results">

    </div>
  </div>
  <script type="module" src="dist/main.js"></script>
</body>
</html>
